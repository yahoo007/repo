<!DOCTYPE html>
<html>
<body>
    <h2>Système DevSecOps V2</h2>
    <form action="/ajouter" method="POST">
        <input type="text" name="demande" placeholder="Entrez votre demande">
        <button type="submit">Envoyer</button>
    </form>
    <hr>
    <h3>Historique des demandes :</h3>
    <ul>
        {% for d in demandes %}
            <li>{{ d[0] }}</li>
        {% endfor %}
    </ul>
</body>
</html>
